[build-system]
requires = ["setuptools>=68", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "sn-proactive-agent"
version = "0.1.3"
description = "本地主动记忆服务：记录项目进展，适时提醒下一步。"
readme = "README.pypi.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sn-proactive-agent = "sn_proactive_agent.__main__:main"

[tool.setuptools]
packages = [
  "sn_proactive_agent",
  "sn_proactive_agent_connectors",
  "sn_proactive_agent_connectors.acp",
  "sn_proactive_agent_connectors.acp.targets",
  "sn_proactive_agent_connectors.codex",
  "sn_proactive_agent_connectors.hermes",
  "sn_proactive_agent_connectors.hermes.classic",
  "sn_proactive_agent_connectors.hermes.tui",
]

[tool.setuptools.package-dir]
"" = "src"
sn_proactive_agent_connectors = "src/sn_proactive_agent_connectors"
"sn_proactive_agent_connectors.acp" = "src/sn_proactive_agent_connectors/acp"
"sn_proactive_agent_connectors.acp.targets" = "src/sn_proactive_agent_connectors/acp/targets"
"sn_proactive_agent_connectors.hermes" = "src/sn_proactive_agent_connectors/hermes"
"sn_proactive_agent_connectors.hermes.classic" = "src/sn_proactive_agent_connectors/hermes/classic"
"sn_proactive_agent_connectors.hermes.tui" = "src/sn_proactive_agent_connectors/hermes/tui"

[tool.setuptools.package-data]
sn_proactive_agent = ["web/*.html", "web/*.css", "web/*.js"]
"sn_proactive_agent_connectors.hermes.tui" = ["plugin.yaml", "patches/*.patch", "*.ts"]
