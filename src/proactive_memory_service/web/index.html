<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef1ed" />
    <title>Proactive Memory · 工作台</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260903-report-cards" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark"><span></span><span></span><span></span></div>
          <div class="brand-copy">
            <h1>记忆工作台</h1>
          </div>
          <button id="daily-report-open" class="report-trigger" type="button" aria-haspopup="dialog" aria-controls="daily-report-modal" aria-label="查看日报">
            <span>日报</span>
            <span id="daily-report-unread" class="report-unread" aria-label="有新的日报" hidden></span>
          </button>
        </div>
        <div class="service-state">
          <span class="live-dot"></span>
          <span>本地服务</span>
          <span class="state-divider"></span>
          <span id="last-updated">正在连接…</span>
        </div>
      </header>

      <section class="panel suggestion-panel" aria-labelledby="suggestion-title">
        <div class="panel-heading">
          <div class="heading-copy">
            <p class="panel-kicker panel-kicker-red">待处理</p>
            <h2 id="suggestion-title">建议与决策</h2>
          </div>
          <span id="suggestion-count" class="count-pill">0 条待处理</span>
        </div>
        <div id="suggestion-content" class="suggestion-content">
          <div class="loading-state"><span class="spinner"></span>正在读取最新决策…</div>
        </div>
      </section>

      <section class="panel projects-panel" aria-labelledby="projects-title">
        <div class="panel-heading projects-heading">
          <div class="heading-copy">
            <p class="panel-kicker panel-kicker-blue">项目状态</p>
            <h2 id="projects-title">项目进展</h2>
          </div>
          <div id="project-summary" class="muted-label">正在读取项目…</div>
        </div>
        <div id="projects-content" class="projects-content">
          <div class="loading-state"><span class="spinner"></span>正在读取 Project / Item…</div>
        </div>
      </section>

    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="daily-report-modal" class="report-modal" hidden>
      <div class="report-backdrop" data-report-close></div>
      <section class="report-dialog" role="dialog" aria-modal="true" aria-labelledby="daily-report-title" aria-describedby="daily-report-subtitle">
        <header class="report-dialog-header">
          <div>
            <div class="report-kicker"><span class="report-kicker-mark" aria-hidden="true"></span> 今日摘要</div>
            <h2 id="daily-report-title">项目日报</h2>
            <p id="daily-report-subtitle" class="report-date">正在读取…</p>
          </div>
          <button id="daily-report-close" class="report-close" type="button" aria-label="关闭日报">×</button>
        </header>
        <div id="daily-report-content" class="report-content">
          <div class="loading-state"><span class="spinner"></span>正在整理项目进展…</div>
        </div>
        <footer class="report-dialog-footer">
          <span id="daily-report-footnote" class="muted-label">日报只保留每个项目的关键进展。</span>
          <button id="daily-report-done" class="report-done" type="button">知道了</button>
        </footer>
      </section>
    </div>
    <script src="/static/app.js?v=20260903-cards-v2"></script>
  </body>
</html>
